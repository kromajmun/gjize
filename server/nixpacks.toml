# Configuration Railway / Nixpacks
# - ffmpeg : extraction audio (yt-dlp) + chunking 25 Mo
# - python3 : youtube-dl-exec exige un binaire python lors de son preinstall,
#   même quand il finit par utiliser son binaire yt-dlp bundlé. Sans Python,
#   `npm ci` plante au build avec "youtube-dl-exec needs Python".

[phases.setup]
nixPkgs = ['nodejs_20', 'ffmpeg', 'python3']

[start]
cmd = 'npm start'
